tools:
  - class_name: verl.tools.search_tool.SearchTool
    config:
      retrieval_service_url: http://127.0.0.1:1249/search
      topk: 10
      num_workers: 64
      rate_limit: 64
      timeout: 600
      enable_global_rate_limit: true
      type: native
    tool_schema:
      type: function
      function:
        name: search
        description: Search the local Wiki-18 corpus with concise discriminative queries. Open promising doc:// cursors instead of repeatedly paraphrasing one search.
        parameters:
          type: object
          properties:
            query:
              type: array
              items:
                type: string
              description: One to three complete complementary search queries.
          required:
            - query

  - class_name: verl.tools.corpus_browser_tool.CorpusBrowserTool
    config:
      browser_service_url: http://127.0.0.1:1249
      num_workers: 64
      rate_limit: 64
      timeout: 600
      enable_global_rate_limit: true
      type: native
    tool_schema:
      type: function
      function:
        name: open
        description: Open a stable doc:// document cursor and return deterministic numbered source lines. Use loc for another window and goal to position the first window.
        parameters:
          type: object
          properties:
            url:
              type: string
              description: Exact doc:// cursor copied from a search result.
            loc:
              type: integer
            num_lines:
              type: integer
            goal:
              type: string
          required:
            - url

  - class_name: verl.tools.corpus_browser_tool.CorpusBrowserTool
    config:
      browser_service_url: http://127.0.0.1:1249
      num_workers: 64
      rate_limit: 64
      timeout: 600
      enable_global_rate_limit: true
      type: native
    tool_schema:
      type: function
      function:
        name: find
        description: Find an exact name, year, or short phrase in the current document, then open near a matching line for wider context.
        parameters:
          type: object
          properties:
            cursor:
              type: string
              description: A doc:// cursor; if omitted the most recently opened cursor is reused.
            pattern:
              type: string
            context_lines:
              type: integer
            max_hits:
              type: integer
          required:
            - pattern
